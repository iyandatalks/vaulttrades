name: Build VaultTrades Copier EA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - mt5/VaultTrades_Copier.mq5
      - .github/workflows/build-copier.yml

permissions:
  contents: write

jobs:
  build-copier:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile VaultTrades Copier
        uses: fx31337/mql-compile-action@v2
        with:
          path: mt5/VaultTrades_Copier.mq5
          include: .
          init-platform: true
          mt-version: 5.0.0.2515
          verbose: true
          log-file: copier-compile.log

      - name: Verify compiled binary
        shell: powershell
        run: |
          $compiled = Get-ChildItem -Path . -Recurse -Filter "VaultTrades_Copier.ex5" | Select-Object -First 1
          if (-not $compiled) { throw "VaultTrades_Copier.ex5 was not produced." }
          Copy-Item $compiled.FullName "mt5/VaultTrades_Copier.ex5" -Force
          Copy-Item $compiled.FullName "public/downloads/VaultTrades_Copier.ex5" -Force

          $hash = (Get-FileHash "mt5/VaultTrades_Copier.ex5" -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item "mt5/VaultTrades_Copier.ex5").Length
          Write-Host "Copier SHA256=$hash"
          Write-Host "Copier size=$size"

          if ($size -le 0) { throw "Compiled binary is empty." }

          $sourceHash = (Get-FileHash "mt5/VaultTrades_Copier.mq5" -Algorithm SHA256).Hash.ToLower()
          @"
          {
            "product": "VaultTrades Customer Copier",
            "file": "VaultTrades_Copier.ex5",
            "version": "1.11",
            "sizeBytes": $size,
            "sha256": "$hash",
            "source": "mt5/VaultTrades_Copier.mq5",
            "sourceSha256": "$sourceHash"
          }
          "@ | Set-Content "public/downloads/VaultTrades_Copier.version.json"

      - name: Publish compiled Copier
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mt5/VaultTrades_Copier.ex5 public/downloads/VaultTrades_Copier.ex5 public/downloads/VaultTrades_Copier.version.json
          if (git diff --cached --quiet) {
            Write-Host "No binary changes to publish."
            exit 0
          }
          git commit -m "Publish VaultTrades Copier v1.11"
          git push origin HEAD:main
