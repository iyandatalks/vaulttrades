name: Build VaultTrades Copier EA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - mt5/VaultTrades_Copier.mq5
      - .github/workflows/build-copier.yml

permissions:
  contents: write

jobs:
  build-copier:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch and verify compiled Copier binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/downloads

          curl -fL --retry 3 --retry-all-errors             "https://vaulttradesve.com/downloads/VaultTrades_Copier.ex5"             -o mt5/VaultTrades_Copier.ex5

          expected_sha256="7a2b8d3beceb8848999e8383f8463dbb76012a024ac90a64e42bae9539c2bd41"
          expected_size="80856"

          actual_sha256="$(sha256sum mt5/VaultTrades_Copier.ex5 | awk '{print $1}')"
          actual_size="$(stat -c '%s' mt5/VaultTrades_Copier.ex5)"

          test "$actual_size" = "$expected_size"
          test "$actual_sha256" = "$expected_sha256"

          cp -f mt5/VaultTrades_Copier.ex5 public/downloads/VaultTrades_Copier.ex5
          source_sha256="$(sha256sum mt5/VaultTrades_Copier.mq5 | awk '{print $1}')"

          cat > public/downloads/VaultTrades_Copier.version.json <<EOF
          {
            "product": "VaultTrades Customer Copier",
            "file": "VaultTrades_Copier.ex5",
            "version": "1.10",
            "sizeBytes": $actual_size,
            "sha256": "$actual_sha256",
            "source": "mt5/VaultTrades_Copier.mq5",
            "sourceSha256": "$source_sha256"
          }
          EOF

      - name: Publish compiled Copier to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mt5/VaultTrades_Copier.ex5 public/downloads/VaultTrades_Copier.ex5 public/downloads/VaultTrades_Copier.version.json

          if git diff --cached --quiet; then
            echo "Compiled Copier is already current; nothing to commit."
            exit 0
          fi

          git commit -m "Publish VaultTrades Copier v1.10"
          git push origin HEAD:main
