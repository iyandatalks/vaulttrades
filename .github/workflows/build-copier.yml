name: Build VaultTrades Copier EA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - mt5/VaultTrades_Copier.mq5
      - .github/workflows/build-copier.yml

permissions:
  contents: write

jobs:
  build-copier:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          $installRoot = Join-Path $env:RUNNER_TEMP 'VaultTrades-MT5'
          Invoke-WebRequest -Uri 'https://download.terminal.free/cdn/web/metaquotes.ltd/mt5/mt5setup.exe' -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList '/auto', ('/path:"' + $installRoot + '"') -Wait -NoNewWindow
          if (-not (Test-Path $installRoot)) { throw "MetaTrader 5 installation directory was not created: $installRoot" }
          $metaEditor = Get-ChildItem -Path $installRoot -Recurse -Filter 'metaeditor64.exe' -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $metaEditor) { throw "metaeditor64.exe was not found under $installRoot" }
          Start-Process -FilePath $metaEditor.FullName -ArgumentList '/portable' -WorkingDirectory $installRoot | Out-Null
          Start-Sleep -Seconds 8
          Get-Process -Name 'metaeditor64' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          "MT5_ROOT=$installRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "METAEDITOR=$($metaEditor.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Checkout MQL5 standard library for CI
        uses: actions/checkout@v4
        with:
          repository: gsemet/mt5-include
          ref: d913f3880a6120e7f8d276b97e819c3e7d97e95b
          path: .ci-mt5-include
          fetch-depth: 1

      - name: Compile VaultTrades Copier
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = (Resolve-Path 'mt5/VaultTrades_Copier.mq5').Path

          $buildMql5 = Join-Path $env:RUNNER_TEMP 'VaultTrades-MQL5'
          $includeRoot = Join-Path $buildMql5 'Include'
          New-Item -ItemType Directory -Force -Path $includeRoot | Out-Null

          Copy-Item -Path (Join-Path (Resolve-Path '.ci-mt5-include').Path '*') -Destination $includeRoot -Recurse -Force

          $tradeInclude = Join-Path $includeRoot 'TradeTrade.mqh'
          $objectInclude = Join-Path $includeRoot 'Object.mqh'
          if (-not (Test-Path $tradeInclude)) { throw "Trade.mqh not found in CI include tree: $tradeInclude" }
          if (-not (Test-Path $objectInclude)) { throw "Object.mqh not found in CI include tree: $objectInclude" }

          Write-Host "Using CI include root: $includeRoot"

          $compileLog = Join-Path (Split-Path $source -Parent) 'VaultTrades_Copier.log'
          $compileArgs = @(
            '/portable',
            "/compile:$source",
            "/include:$buildMql5",
            '/log'
          )

          & $env:METAEDITOR @compileArgs
          $exitCode = $LASTEXITCODE
          Start-Sleep -Seconds 2

          if (-not (Test-Path $compileLog)) {
            Write-Host "Compilation log not found at expected path. Searching..."
            $compileLog = Get-ChildItem -Path (Split-Path $source -Parent) -Filter 'VaultTrades_Copier.log' -File -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $compileLog) { throw 'MetaEditor did not create a compilation log.' }
            $compileLog = $compileLog.FullName
          }

          $log = Get-Content -Raw $compileLog
          Write-Host $log

          if ($exitCode -ne 0) { throw "MetaEditor exited with code $exitCode." }
          if ($log -match '(?i)(error\s*\(|\b[1-9][0-9]*\s+error)') {
            throw 'Copier compilation reported errors.'
          }
          if ($log -notmatch '(?i)0\s+error') {
            throw 'Copier compilation did not report zero errors.'
          }

          $compiled = Join-Path (Split-Path $source -Parent) 'VaultTrades_Copier.ex5'
          if (-not (Test-Path $compiled)) { throw "Expected compiled file was not created: $compiled" }

          New-Item -ItemType Directory -Force -Path 'public/downloads' | Out-Null
          Copy-Item -Force $compiled 'public/downloads/VaultTrades_Copier.ex5'

          $sha256 = (Get-FileHash 'public/downloads/VaultTrades_Copier.ex5' -Algorithm SHA256).Hash
          $meta = @{
            product = 'VaultTrades Customer Copier'
            file = 'VaultTrades_Copier.ex5'
            version = '1.00'
            source = 'mt5/VaultTrades_Copier.mq5'
            sha256 = $sha256
            builtAtUtc = (Get-Date).ToUniversalTime().ToString('o')
          } | ConvertTo-Json

          $meta | Set-Content 'public/downloads/VaultTrades_Copier.version.json' -Encoding utf8

      - name: Publish compiled Copier to main
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/downloads/VaultTrades_Copier.ex5 public/downloads/VaultTrades_Copier.version.json
          if (git diff --cached --quiet) { Write-Host 'Compiled Copier is already current; nothing to commit.'; exit 0 }
          git commit -m 'Publish compiled VaultTrades Copier EA'
          git push origin HEAD:main